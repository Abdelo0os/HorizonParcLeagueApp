workflows:
  version: 2
  android:
    name: Build Android APK
    max_build_duration: 60
    instance_type: macos-latest
    platforms:
      android:
        gradle: "4.0"  # Set your Gradle version
        android_home: "$HOME/Library/Android/sdk"
        build_type: release  # Set to 'debug' if you want debug builds
        project_path: app  # Points to the 'app' folder where your Android app is located
        gradle_task: assembleRelease  # Or 'assembleDebug' for debug builds
        flutter:
          version: stable  # If using Flutter, otherwise remove this line
    scripts:
      - name: Install dependencies
        script: |
          cd $CI_PROJECT_DIR
          ./gradlew clean
          ./gradlew dependencies
      - name: Build APK
        script: |
          cd $CI_PROJECT_DIR
          ./gradlew assembleRelease
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk  # Change path as needed
